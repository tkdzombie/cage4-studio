[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "cage4-baselines"
version = "0.4.0"
requires-python = ">=3.10,<3.12"
dependencies = ['cage4-protocol==0.3.0', 'PyYAML>=6,<7', 'numpy>=1.26,<2', 'torch>=2.2,<2.3']
[project.scripts]
cage4 = "cage4_baselines.experiments.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cage4_baselines = ["paper/upstreams.json"]
