# Author-source integration; full protocol: docs/PAPER_BASELINES.md
algorithm: macpo
seed: 101
episodes: 2000
steps: 500
rollout_episodes: 16
num_envs: 16
torch_threads: 8
reward_scale: 0.01
budget_level: main
checkpoint_every: 50
record_replay: true
snapshot_every: 50
deterministic_eval: false  # primary stochastic policy; also report greedy
hyperparameters:
  hidden_size: 256
  layer_N: 1
  ppo_epoch: 1  # one author CPO update; not ten PPO passes
  lr: 0.00005
  critic_lr: 0.00005
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.001
  kl_threshold: 0.01
  fraction_coef: 0.1
  ls_step: 10
observation:
  mode: belief  # current / persistent / age / belief (age + confidence)
  age_max: 500
  decay: 0.01
  dropout: 0.0
  delay: 0
  noise: 0.0
  seed: 0
