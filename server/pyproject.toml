[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "cage4-server"
version = "0.3.0"
requires-python = ">=3.10,<3.12"
dependencies = ['cage4-protocol==0.3.0', 'streamlit>=1.52,<2', 'pandas>=2.1,<3']
[tool.setuptools.packages.find]
where = ["src"]
