name: Core validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 PyYAML==6.0.1
      - name: Compile and unit tests (no large simulator/Ray/Torch downloads)
        env:
          PYTHONPATH: protocol:server/src:cage4-baselines/src
        run: |
          python -m compileall -q protocol server/src cage4-baselines/src ops tests
          python -m unittest discover -s tests -v
          bash -n client/connect.sh client/build_mac_app.sh ops/check.sh ops/research.sh
