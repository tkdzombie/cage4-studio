name: Core validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 PyYAML==6.0.1
      - name: Compile and unit tests (no large simulator/Ray/Torch downloads)
        env:
          PYTHONPATH: protocol:server/src:cage4-baselines/src
        run: |
          python -m compileall -q protocol server/src cage4-baselines/src ops tests cage4-baselines/tests cage4-baselines/examples
          python -m unittest discover -s tests -v
          python -m unittest discover -s cage4-baselines/tests -v
          python -m cage4_baselines --help
          python -m cage4_baselines smoke --help
          python -m cage4_baselines quickstart --help
          bash -n client/connect.sh client/build_mac_app.sh ops/check.sh ops/research.sh
          python -m cage4_baselines.paper --help
          python -m cage4_baselines.safety.calibrate --help
          python -m py_compile cage4-baselines/src/cage4_baselines/experiments/run_baseline.py cage4-baselines/src/cage4_baselines/algorithms/my_algorithm.py
      - name: Build and verify native macOS client
        run: bash client/build_mac_app.sh "$RUNNER_TEMP/cage4-client" example.invalid researcher 18501
