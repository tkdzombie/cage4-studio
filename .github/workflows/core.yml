name: Current CAGE4 source validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate current entry points without simulator downloads
        run: |
          python -m compileall -q run.py cage4 algorithms
          bash -n client/connect.sh client/build_mac_app.sh ops/dashboard.sh
      - name: Build native macOS client
        run: bash client/build_mac_app.sh "$RUNNER_TEMP/cage4-client" example.invalid researcher 18501
